spring:
  application:
    name: razorpay
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/razorpayDB}
    username: ${DB_USER:postgres} # DB_USER, DB_PASS, etc are env variables
    password: ${DB_PASS:password} # ':' this works as a tertiary operator
    # if env variable value is not found then whatever present on right side of ':' will be used
    # we can declare env variables at top of this file also
  jpa:
    hibernate:
      ddl-auto: create
    show-sql: true